name: Tippguru Update

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 10 * * 5,6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tippguru
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete
        run: pip install numpy scipy cryptography
      - name: Tipps berechnen
        env:
          TIPPGURU_PASSWORT: ${{ secrets.TIPPGURU_PASSWORT }}
        run: python tippguru.py
      - name: Verschlüsselte Daten speichern
        run: |
          git config user.name "tippguru-bot"
          git config user.email "tippguru-bot@users.noreply.github.com"
          git add daten.json
          git diff --cached --quiet || git commit -m "Tippguru Update"
          git push
      - name: Seite vorbereiten
        run: |
          mkdir -p _site
          cp index.html daten.json _site/
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
